<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tcc Vr</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="containers-wrapper">

  
<div class="info-container">
  <h2>Bem-vindo</h2>
  <img class="logo" src="" alt="logo">
  <p class="typewriter" data-text="Realize o login para acessar a plataforma de realidade virtual."></p>
</div>

<div class="login-container">
    <form id="authForm">
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Digite seu email" required>
      </div>

      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="password" placeholder="Digite sua senha" required>
      </div>

      <button type="submit" class="login-btn">Entrar</button>
    </form>

    <div class="divider">
      <a class="a" href="cadastro.html">Clique aqui para se cadastrar</a>
    </div>

    <div class="separator">
      <hr class="sep-line">
      <div class="sep-text">ou continue com</div>
    </div>

<div class="social-container-btn">

  <button type="button" id="btnGoogle" class="social-btn google">
    <img src="img/icons8-google.svg" alt="Google">
    <span></span>
  </button>

  <button type="button" id="btnMicrosoft" class="social-btn microsoft">
    <img src="img/microsoft_icon (1).svg" alt="Microsoft">
    <span></span>
  </button>

  <button type="button" id="btnGithub" class="social-btn github">
    <img src="img/github_icon.svg" alt="GitHub">
    <span></span>
  </button>

</div>

    <div class="footer-text">
      TCC • Realidade Virtual
    </div>
</div>


</div>

<script src="typewriter.js"></script>
<script type="module" src="auth.js"></script>

</body>
</html>
