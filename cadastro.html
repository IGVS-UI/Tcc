<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - TCC VR</title>
  <link rel="stylesheet" href="cadastro.css">
</head>
<body>

  <div class="login-container">
    <h2>Cadastrar • Projeto VR</h2>

    <form id="signupForm">
      <div class="input-group">
        <label>Email</label>
        <input id="email" type="email" placeholder="Digite seu email" required>
      </div>

      <div class="input-group">
        <label>Senha</label>
        <input id="password" type="password" placeholder="Crie uma senha (mín. 6)" minlength="6" required>
      </div>

      <button type="submit" class="login-btn">Criar conta</button>
    </form>

    <div class="divider">
      <a href="login.html">Já tenho conta • Entrar</a>
    </div>

   <div class="social-container-btn">

  <button type="button" id="btnGoogle" class="social-btn google">
    <img src="google-icon.svg" alt="Google">
    <span></span>
  </button>

  <button type="button" id="btnMicrosoft" class="social-btn microsoft">
    <img src="microsoft.png" alt="Microsoft">
    <span></span>
  </button>

  <button type="button" id="btnGithub" class="social-btn github">
    <img src="github-svgrepo-com.svg" alt="GitHub">
    <span></span>
  </button>

</div>


    <p id="status" class="footer-text"></p>
  </div>

  <!-- Se seu auth.js tem import, tem que ser module -->
  <script type="module" src="auth.js"></script>
</body>
</html>
