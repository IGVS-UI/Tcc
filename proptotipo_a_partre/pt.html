<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vr Explore</title>
    <link rel="stylesheet" href="pt.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- HEADER -->
    <header>
        <nav-bar>
            <div class="nav-left">
                <ul>
                    <li>
                        <a href="#">
                            <h1>Vr<p class="sub-title">Explore</p></h1>
                        </a>
                    </li>
                </ul>
            </div>
            <div class="nav-center">
                <img src="/img/Group 51(1).png" alt="logo" class="logo">
            </div>
            <div class="nav-right">
                <button class="nav-btn">Login</button>
                <button class="menu-btn" onclick="toggleMenu()">☰</button>
            </div>
        </nav-bar>
    </header>

    <!-- MENU OVERLAY -->
    <div id="menu-overlay" class="menu-overlay">
        <canvas id="wc" class="menu-canvas"></canvas>
        <div class="menu-overlay-content">
            <div class="menu-header">
                <a href="#"><h1>Vr<p class="sub-title">Explore</p></h1></a>
                <button class="close-btn" onclick="toggleMenu()">&#x2715;</button>
            </div>
            <div class="menu-body">
                <div class="menu-cards-section">
                    <div class="menu-card">
                        <h3>Explorar</h3>
                        <p>Descubra mundos imersivos</p>
                    </div>
                    <div class="menu-card2">
                        <h3>Experiências</h3>
                        <p>Viva novas aventuras</p>
                    </div>
                    <div class="menu-card3">
                        <h3>Jogos</h3>
                        <p>Divirta-se em VR</p>
                    </div>
                    <div class="menu-card">
                        <h3>Comunidade</h3>
                        <p>Conecte-se com outros</p>
                    </div>
                </div>

                <nav class="menu-nav">
                    <a href="#" class="menu-nav-item">
                        <span class="text-wrapper">
                            <span class="text top">HOME</span>
                            <span class="text bottom">HOME</span>
                        </span>
                    </a>
                    <a href="#" class="menu-nav-item">
                        <span class="text-wrapper">
                            <span class="text top">TECNOLOGIAS</span>
                            <span class="text bottom">TECNOLOGIAS</span>
                        </span>
                    </a>
                    <a href="#" class="menu-nav-item">
                        <span class="text-wrapper">
                            <span class="text top">EXPLORE</span>
                            <span class="text bottom">EXPLORE</span>
                        </span>
                    </a>
                    <a href="#" class="menu-nav-item">
                        <span class="text-wrapper">
                            <span class="text top">INTERAÇÕES</span>
                            <span class="text bottom">INTERAÇÕES</span>
                        </span>
                    </a>
                    <img src="./img/Group 51.png" alt="logo" class="section-logo">
                </nav>
            </div>
        </div>
    </div>

    <!-- HERO - efeito máscara -->
    <main class="main-content">
        <section class="hero-section">
            <canvas id="hero-canvas"></canvas>
            <div class="hero-footer">
                <p>Human form / Machine Logic</p>
                <p>Tcc vr</p>
            </div>
        </section>
    </main>

    <!-- Three.js CDN (global) ANTES do hero_mask.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Scripts do projeto -->
    <script src="pt.js"></script>
    <script src="back_menu.js"></script>
    <script src="hero_mask.js"></script>
</body>
</html>
